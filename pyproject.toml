[project]
name = "jobsuche-client"
version = "0.1.0"
description = "Typed async Python client for the Bundesagentur für Arbeit Jobsuche API"
readme = "README.md"
authors = [
    { name = "Shahwar Zia", email = "66971502+ShahwarZia@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.29.0",
    "pydantic>=2.14.4",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
